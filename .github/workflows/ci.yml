name: Tests and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_API: pyside6
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Windows software OpenGL
        if: runner.os == 'Windows'
        # The same pinned display action used by napari's own CI.
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79
        with:
          pyvista: 'false'
          install-mesa3d-offscreen: 'false'
          mesa3d-release: '24.3.0'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libgl1 libdbus-1-3 libxrender1 libxi6 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxkbcommon-x11-0
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m ruff check .
      - name: Verify Linux Qt platform dependencies
        if: runner.os == 'Linux'
        run: |
          ldd "$(python -c 'from qtpy.QtCore import QLibraryInfo; print(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath) + "/platforms/libqxcb.so")')"
          xvfb-run -a -s "-screen 0 1920x1080x24" python -c "from qtpy.QtWidgets import QApplication; app = QApplication([]); print('Qt display ready')"
      - name: Tests (Linux OpenGL display)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest
      - name: Tests (Windows OpenGL display)
        if: runner.os == 'Windows'
        env:
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '0'
        run: python -m pytest
      - run: npe2 validate src/napari_breast_mri/napari.yaml
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Demo export smoke test
        run: python -m napari_breast_mri --export-demo demo-report
